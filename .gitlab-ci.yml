stages:
  - linit
  - unit_test
  - integration_test
  - build
  - docker

default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2

.cache_pip: &cache_pip
  cache:
    key: "pip-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip

.cache_npm: &cache_npm
  cache:
    key: "npm-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/npm

.rules_backend_changes: &rules_backend_changes
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - backend/**/*

    - if: $CI_COMMIT_BRANCH
      changes:
        - backend/**/*

.rules_frontend_changes: &rules_frontend_changes
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - frontend/**/*

    - if: $CI_COMMIT_BRANCH
      changes:
        - frontend/**/*

.rules_dev_main_only: &rules_dev_main_only
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'

# -----------------------
# Backend, Python
# -----------------------

backend:lint:
  stage: lint
  image: python:3.14
  <<: *cache_pip
  <<: *rules_backend_changes
  before_script:
    - python --version
    - pip install --upgrade pip
    - |
      if [ -f backend/requirements.txt ]; then
        pip install -r backend/requirements.txt
      elif [ -f backend/pyproject.toml ]; then
        pip install -e backend
      else
        echo "No backend/requirements.txt or backend/pyproject.toml found, please add one."
        exit 1
      fi
    - pip install flake8
  script:
    - flake8 backend

backend:unit:
  stage: unit_test
  image: python:3.14
  <<: *cache_pip
  <<: *rules_backend_changes
  before_script:
    - pip install --upgrade pip
    - |
      if [ -f backend/requirements.txt ]; then
        pip install -r backend/requirements.txt
      elif [ -f backend/pyproject.toml ]; then
        pip install -e backend
      else
        echo "No backend/requirements.txt or backend/pyproject.toml found, please add one."
        exit 1
      fi
    - pip install pytest
  script:
    # Convention: integration tests are marked with "integration"
    - cd backend
    - pytest -m "not integration" -q
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: backend/junit-unit.xml
  after_script:
    - |
      # Best-effort JUnit if you do not generate it yet
      if [ -d backend ]; then
        true
      fi

backend:integration:
  stage: integration_test
  image: python:3.14
  <<: *cache_pip
  <<: *rules_backend_changes
  # Add services here if you need them, example:
  # services:
  #   - name: postgres:16
  #     alias: postgres
  before_script:
    - pip install --upgrade pip
    - |
      if [ -f backend/requirements.txt ]; then
        pip install -r backend/requirements.txt
      elif [ -f backend/pyproject.toml ]; then
        pip install -e backend
      else
        echo "No backend/requirements.txt or backend/pyproject.toml found, please add one."
        exit 1
      fi
    - pip install pytest
  script:
    - cd backend
    - pytest -m "integration" -q

# -----------------------
# Frontend, SvelteKit (Vite)
# -----------------------

frontend:lint:
  stage: lint
  image: node:20
  <<: *cache_npm
  <<: *rules_frontend_changes
  script:
    - node --version
    - cd frontend
    - npm ci
    - npm run lint

frontend:check:
  stage: lint
  image: node:20
  <<: *cache_npm
  <<: *rules_frontend_changes
  script:
    - cd frontend
    - npm ci
    # svelte-check if you have it
    - |
      if npm run | grep -q " check"; then
        npm run check
      else
        echo "No npm script 'check' found, skipping."
      fi

frontend:unit:
  stage: unit_test
  image: node:20
  <<: *cache_npm
  <<: *rules_frontend_changes
  script:
    - cd frontend
    - npm ci
    - |
      if npm run | grep -q " test:unit"; then
        npm run test:unit
      else
        echo "No npm script 'test:unit' found, running 'npm test' instead."
        npm test
      fi

frontend:integration:
  stage: integration_test
  image: node:20
  <<: *cache_npm
  <<: *rules_frontend_changes
  script:
    - cd frontend
    - npm ci
    - |
      if npm run | grep -q " test:integration"; then
        npm run test:integration
      else
        echo "No npm script 'test:integration' found, skipping."
      fi

frontend:build:
  stage: build
  image: node:20
  <<: *cache_npm
  <<: *rules_frontend_changes
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    expire_in: 7 days
    paths:
      - frontend/build
      - frontend/.svelte-kit

# -----------------------
# Docker, build and push
# -----------------------

.docker_template:
  stage: docker
  image: docker:24
  services:
    - name: docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker version
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

# Build images for MRs (no push), to validate Dockerfiles
docker:build_only:
  extends: .docker_template
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - docker build -t backend-local -f backend/Dockerfile backend
    - docker build -t frontend-local -f frontend/Dockerfile frontend

# Build and push backend image on dev/main if backend changed
docker:push_backend:
  extends: .docker_template
  <<: *rules_dev_main_only
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'
      changes:
        - backend/**/*
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" = "dev" ]; then
        BRANCH_TAG="dev"
      else
        BRANCH_TAG="main"
      fi
    - IMAGE_NAME="$CI_REGISTRY_IMAGE/backend"
    - docker build -t "$IMAGE_NAME:$BRANCH_TAG" -t "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" -f backend/Dockerfile backend
    - docker push "$IMAGE_NAME:$BRANCH_TAG"
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"

# Build and push frontend image on dev/main if frontend changed
docker:push_frontend:
  extends: .docker_template
  <<: *rules_dev_main_only
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'
      changes:
        - frontend/**/*
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" = "dev" ]; then
        BRANCH_TAG="dev"
      else
        BRANCH_TAG="main"
      fi
    - IMAGE_NAME="$CI_REGISTRY_IMAGE/frontend"
    - docker build -t "$IMAGE_NAME:$BRANCH_TAG" -t "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" -f frontend/Dockerfile frontend
    - docker push "$IMAGE_NAME:$BRANCH_TAG"
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
