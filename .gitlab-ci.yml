stages:
  - lint
  - unit_test
  - integration_test
  - system_test
  - modularity
  - build
  - docker
  - deploy

default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  # Browser-facing host for production frontend build (API is served under https://HOST/api).
  PRODUCTION_PUBLIC_HOST: "wunschkonzert.jj11.ch"
  STAGING_PUBLIC_HOST: "staging-wunschkonzert.jj11.ch"
  DEPLOY_PATH: "/opt/wunschkonzert"
  DEPLOY_PATH_STAGING: "/opt/wunschkonzert-staging"

.cache_uv: &cache_uv
  cache:
    key: "uv-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/uv

.cache_npm: &cache_npm
  cache:
    key: "npm-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/npm

.rules_backend_changes: &rules_backend_changes
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - backend/**/*

    - if: $CI_COMMIT_BRANCH
      changes:
        - backend/**/*

.rules_frontend_changes: &rules_frontend_changes
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - frontend/**/*

    - if: $CI_COMMIT_BRANCH
      changes:
        - frontend/**/*

.rules_dev_main_only: &rules_dev_main_only
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'

.dockerhub_auth: &dockerhub_auth |
  mkdir -p "$HOME/.docker"
  AUTH_FILE="$HOME/.docker/config.json"
  printf '{"auths":{' > "$AUTH_FILE"
  SEP=""

  if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
    AUTH_B64="$(printf '%s:%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64 | tr -d '\n')"
    printf '%s"https://index.docker.io/v1/":{"auth":"%s"}' "$SEP" "$AUTH_B64" >> "$AUTH_FILE"
    SEP=","
    echo "Docker Hub auth configured."
  else
    echo "DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set; Docker Hub pulls may be rate-limited."
  fi

  if [ -n "$CI_DEPENDENCY_PROXY_SERVER" ] && [ -n "$CI_DEPENDENCY_PROXY_USER" ] && [ -n "$CI_DEPENDENCY_PROXY_PASSWORD" ]; then
    DEP_AUTH_B64="$(printf '%s:%s' "$CI_DEPENDENCY_PROXY_USER" "$CI_DEPENDENCY_PROXY_PASSWORD" | base64 | tr -d '\n')"
    printf '%s"%s":{"auth":"%s"}' "$SEP" "$CI_DEPENDENCY_PROXY_SERVER" "$DEP_AUTH_B64" >> "$AUTH_FILE"
    SEP=","
    echo "GitLab Dependency Proxy auth configured."
  else
    echo "CI_DEPENDENCY_PROXY_* vars not set; Dependency Proxy auth not configured."
  fi

  printf '}}\n' >> "$AUTH_FILE"

modularity:check:
  stage: modularity
  image: docker:24
  services:
    - name: docker:24-dind
  variables:
    CHECK_HOST: "docker"
  before_script:
    - *dockerhub_auth
  script:
    - apk add --no-cache docker-compose curl bash
    - chmod +x ./scripts/check_independent.sh
    - chmod +x ./scripts/setup_backend_env.sh
    - ./scripts/setup_backend_env.sh
    - ./scripts/check_independent.sh

# -----------------------
# Backend, Python
# -----------------------

backend:lint:
  stage: lint
  image: python:3.14
  <<: [*cache_uv, *rules_backend_changes]
  before_script:
    - python --version
    - pip install uv
    - cd backend/python
    - uv sync --frozen
  script:
    - uv run --with ruff ruff check .
    - uv run --with ruff ruff format --check .

backend:typecheck:
  stage: lint
  image: python:3.14
  <<: [*cache_uv, *rules_backend_changes]
  before_script:
    - pip install uv
    - cd backend/python
    - uv sync --frozen
  script:
    - uv run mypy .

backend:quality:
  stage: lint
  image: python:3.14
  <<: [*cache_uv, *rules_backend_changes]
  before_script:
    - pip install uv
    - cd backend/python
    - uv sync --frozen
  script:
    - uv run ruff check --output-format=json . > ruff-output.json || true
    - python ../../scripts/ruff_to_codeclimate.py ruff-output.json ../../gl-code-quality-report.json
  artifacts:
    reports:
      codequality: gl-code-quality-report.json

backend:audit:
  stage: lint
  image: python:3.14
  <<: [*cache_uv, *rules_backend_changes]
  before_script:
    - pip install uv
    - cd backend/python
    - uv sync --frozen
  script:
    - uv run --with pip-audit pip-audit --local

frontend:audit:
  stage: lint
  image: node:22
  <<: [*cache_npm, *rules_frontend_changes]
  script:
    - cd frontend
    - npm ci
    - npm audit --omit=dev --audit-level=high

backend:unit:
  stage: unit_test
  image: python:3.14
  services:
    - name: docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  <<: [*cache_uv, *rules_backend_changes]
  before_script:
    - pip install uv
    - *dockerhub_auth
    - cd backend/python
    - cp ../.env.example .env
    - uv sync --frozen
  script:
    # Use --allow-hosts to whitelist docker and localhost while blocking the internet
    - uv run --with pytest pytest --allow-hosts=docker,localhost,127.0.0.1 --allow-unix-socket -m "not system" -q --junit-xml=junit-all.xml
  coverage: '/TOTAL.*\s+(\d+\%)/'
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: backend/python/junit-all.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/python/cobertura.xml

backend:integration:
  stage: integration_test
  image: docker:24
  services:
    - name: docker:24-dind
  <<: *rules_backend_changes
  before_script:
    - *dockerhub_auth
    - apk add --no-cache docker-compose
  script:
    - cd backend
    - docker compose -f compose.test.yaml run --rm api-test uv run pytest -m "integration" -q --no-cov
  after_script:
    - cd backend
    - docker compose -f compose.test.yaml down -v

system:e2e:
  stage: system_test
  image: docker:24
  services:
    - name: docker:24-dind
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - backend/**/*
        - frontend/**/*
        - compose.yaml
        - compose.system.yaml
        - backend/compose.yaml
        - frontend/compose.yaml
        - Makefile
    - if: $CI_COMMIT_BRANCH
      changes:
        - backend/**/*
        - frontend/**/*
        - compose.yaml
        - compose.system.yaml
        - backend/compose.yaml
        - frontend/compose.yaml
        - Makefile
      when: manual
  before_script:
    - *dockerhub_auth
    - apk add --no-cache docker-compose bash
    - chmod +x ./scripts/setup_backend_env.sh
    - ./scripts/setup_backend_env.sh
  script:
    - make test-system

# -----------------------
# Frontend, SvelteKit (Vite)
# -----------------------

frontend:lint:
  stage: lint
  image: node:22
  <<: [*cache_npm, *rules_frontend_changes]
  script:
    - node --version
    - cd frontend
    - npm ci
    - npm run lint

frontend:check:
  stage: lint
  image: node:22
  <<: [*cache_npm, *rules_frontend_changes]
  script:
    - cd frontend
    - npm ci
    # svelte-check if you have it
    - |
      if npm run | grep -q " check"; then
        npm run check
      else
        echo "No npm script 'check' found, skipping."
      fi

frontend:unit:
  stage: unit_test
  image: docker:24
  services:
    - name: docker:24-dind
  <<: *rules_frontend_changes
  before_script:
    - *dockerhub_auth
    - apk add --no-cache docker-compose
  script:
    - cd frontend
    - docker build --target test -t frontend-unit .
    - mkdir -p coverage
    - mkdir -p junit
    - |
      echo "Running npm script 'test:unit' in working directory $(pwd)"
      if grep -q "test:unit" package.json; then
        docker run --rm --network none \
          -v "$(pwd)/coverage:/app/coverage" \
          -v "$(pwd)/junit:/app/junit" \
          frontend-unit npm run test:unit -- --coverage \
          --reporter=default --reporter=junit --outputFile.junit=/app/junit/junit.xml
      else
        echo "No npm script 'test:unit' found, running 'npm test' instead."
        docker run --rm --network none \
          -v "$(pwd)/coverage:/app/coverage" \
          -v "$(pwd)/junit:/app/junit" \
          frontend-unit npm test -- --coverage \
          --reporter=default --reporter=junit --outputFile.junit=/app/junit/junit.xml
      fi
    - |
      COVERAGE_FILE="$(find "$(pwd)/coverage" -type f -name "cobertura-coverage.xml" | head -n 1)"
      if [ -z "$COVERAGE_FILE" ]; then
        echo "Coverage file not found in $(pwd)/coverage"
        ls -la "$(pwd)/coverage" || true
        exit 1
      fi
      echo "Coverage file: $COVERAGE_FILE"

  coverage: '/Lines\s*:\s*([\d.]+)%/'
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: frontend/junit/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml

frontend:integration:
  stage: integration_test
  image: docker:24
  services:
    - name: docker:24-dind
  <<: *rules_frontend_changes
  before_script:
    - *dockerhub_auth
    - apk add --no-cache docker-compose
  script:
    - cd frontend
    # Use docker run with --network none to ensure total isolation
    - docker build --target test -t frontend-test .
    - |
      if grep -q "test:integration" package.json; then
        docker run --rm --network none frontend-test npm run test:integration
      else
        echo "No npm script 'test:integration' found, skipping."
      fi

frontend:build:
  stage: build
  image: node:22
  <<: [*cache_npm, *rules_frontend_changes]
  script:
    - cd frontend
    - npm ci
    - DOCKER_BUILD=true npm run build
  artifacts:
    expire_in: 7 days
    paths:
      - frontend/build
      - frontend/.svelte-kit

# -----------------------
# Docker, build and push
# -----------------------

.docker_template:
  stage: docker
  image: docker:24
  services:
    - name: docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - *dockerhub_auth
    - docker version
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

# Build images for MRs (no push), to validate Dockerfiles
docker:build_only:
  extends: .docker_template
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - docker build -t backend-local -f backend/Dockerfile backend
    - docker build -t frontend-local -f frontend/Dockerfile frontend

# Build and push backend image on dev/main if backend changed
docker:push_backend:
  extends: .docker_template
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'
      changes:
        - backend/**/*
        # or changes to gitlab ci
        - .gitlab-ci.yml
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" = "dev" ]; then
        BRANCH_TAG="dev"
      else
        BRANCH_TAG="main"
      fi
    - IMAGE_NAME="$CI_REGISTRY_IMAGE/backend"
    - docker build -t "$IMAGE_NAME:$BRANCH_TAG" -t "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" -f backend/Dockerfile backend
    - docker push "$IMAGE_NAME:$BRANCH_TAG"
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"

# Build and push frontend image on dev/main if frontend changed
docker:push_frontend:
  extends: .docker_template
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'
      changes:
        - frontend/**/*
        # or changes to gitlab ci
        - .gitlab-ci.yml
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" = "dev" ]; then
        BRANCH_TAG="dev"
      else
        BRANCH_TAG="main"
      fi
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        export PUBLIC_API_URL="https://${PRODUCTION_PUBLIC_HOST}/api"
        export PUBLIC_WS_URL="wss://${PRODUCTION_PUBLIC_HOST}/api"
      elif [ "$CI_COMMIT_BRANCH" = "dev" ]; then
        export PUBLIC_API_URL="https://${STAGING_PUBLIC_HOST}/api"
        export PUBLIC_WS_URL="wss://${STAGING_PUBLIC_HOST}/api"
      else
        export PUBLIC_API_URL="http://localhost:8000"
        export PUBLIC_WS_URL="ws://localhost:8000"
      fi
    - IMAGE_NAME="$CI_REGISTRY_IMAGE/frontend"
    - docker build --build-arg "PUBLIC_API_URL=${PUBLIC_API_URL}" --build-arg "PUBLIC_WS_URL=${PUBLIC_WS_URL}" -t "$IMAGE_NAME:$BRANCH_TAG" -t "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" -f frontend/Dockerfile frontend
    - docker push "$IMAGE_NAME:$BRANCH_TAG"
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"

# -----------------------
# Deploy (production: main, staging: dev)
# -----------------------

.deploy_ssh_base:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client bash
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - eval $(ssh-agent -s)
    - printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

deploy:production:
  extends: .deploy_ssh_base
  resource_group: production
  environment:
    name: production
    url: https://wunschkonzert.jj11.ch
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - job: docker:push_backend
      optional: true
    - job: docker:push_frontend
      optional: true
  script:
    - |
      ssh -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<REMOTE
      set -euo pipefail
      docker network inspect wunschkonzert_edge >/dev/null 2>&1 || docker network create wunschkonzert_edge
      echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
      export BACKEND_IMAGE="$CI_REGISTRY_IMAGE/backend:main"
      export FRONTEND_IMAGE="$CI_REGISTRY_IMAGE/frontend:main"
      cd "$DEPLOY_PATH"
      docker compose --env-file .env -f compose.prod.yaml pull
      docker compose --env-file .env -f compose.prod.yaml up -d --remove-orphans
      REMOTE

deploy:staging:
  extends: .deploy_ssh_base
  resource_group: staging
  environment:
    name: staging
    url: https://staging-wunschkonzert.jj11.ch
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
  needs:
    - job: docker:push_backend
      optional: true
    - job: docker:push_frontend
      optional: true
  script:
    - |
      ssh -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<REMOTE
      set -euo pipefail
      docker network inspect wunschkonzert_edge >/dev/null 2>&1 || docker network create wunschkonzert_edge
      echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
      export BACKEND_IMAGE="$CI_REGISTRY_IMAGE/backend:dev"
      export FRONTEND_IMAGE="$CI_REGISTRY_IMAGE/frontend:dev"
      cd "$DEPLOY_PATH_STAGING"
      docker compose --env-file .env.staging -f compose.staging.yaml pull
      docker compose --env-file .env.staging -f compose.staging.yaml up -d --remove-orphans
      REMOTE
