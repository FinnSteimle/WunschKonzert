services:

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://localhost:8000}
    volumes:
      - .:/app                          # hot reload in dev
      - /app/node_modules               # keep container node_modules isolated from host
    command: npm run dev -- --host 0.0.0.0 --port 5173
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
