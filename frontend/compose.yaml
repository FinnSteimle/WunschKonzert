services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://localhost:8000}
    ports:
      - '3000:3000'
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://localhost:8000}
      NODE_ENV: ${NODE_ENV:-development}
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
