[project]
name = "wunschkonzert-backend"
version = "0.1.0"
description = "Wunschkonzert backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "websockets>=14",
    "asyncpg>=0.30",
    "greenlet>=3.0",
    "httpx>=0.27",
    "alembic>=1.18.4",
    "sqlalchemy>=2.0.48",
    "psycopg2-binary>=2.9.11",
    "ruff>=0.15.7",
]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: mark a test as an integration test"
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-socket>=0.7.0",
]
