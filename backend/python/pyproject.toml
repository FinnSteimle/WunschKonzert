[project]
name = "wunschkonzert-backend"
version = "0.1.0"
description = "Wunschkonzert backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "websockets>=14",
    "asyncpg>=0.30",
    "greenlet>=3.0",
    "httpx>=0.27",
    "alembic>=1.18.4",
    "sqlalchemy>=2.0.48",
    "psycopg2-binary>=2.9.11",
    "ruff>=0.15.7",
    "passlib[bcrypt]>=1.7.4",
]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
addopts = "--cov=. --cov-report=term-missing --cov-report=xml:cobertura.xml"
markers = [
    "unit: mark a test as a unit test",
    "integration: mark a test as an integration test",
    "system: mark a test as a system/e2e test",
]

[tool.coverage.run]
omit = [
    "*/asyncpg/*",
    "*/.venv/*",
    "*/tests/*"
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-socket>=0.7.0",
    "testcontainers[postgres]>=4.14.2",
    "mypy>=1.15.0",
    "playwright>=1.58.0",
    "pytest-playwright>=0.7.2",
]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "migrations/"]

[[tool.mypy.overrides]]
module = "sqlalchemy.*"
ignore_missing_imports = true

[tool.ruff]
#line-length = 125

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C90"]  # pycodestyle, pyflakes, isort, mccabe
ignore = ["E501"]  # line length is enforced by ruff format, not ruff check

[tool.ruff.lint.mccabe]
max-complexity = 10
