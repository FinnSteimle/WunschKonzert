services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEV: "true"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-wunschkonzert}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      TESTCONTAINERS_RYUK_DISABLED: "true"
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    volumes:
      - ./python:/app # hot reload in dev
      - venv:/app/.venv # keep container's venv, don't override with host
      - ./.env:/.env # mount .env file
      - /var/run/docker.sock:/var/run/docker.sock # allow DooD for testcontainers
    command: uv run --env-file /.env uvicorn main:app --reload --host 0.0.0.0 --port 8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  db:
    image: postgres:17.9-alpine3.23@sha256:6f30057d31f5861b66f3545d4821f987aacf1dd920765f0acadea0c58ff975b1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-wunschkonzert}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432" # expose for local tooling (e.g. pgAdmin, psql); remove in prod
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-wunschkonzert}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:
  venv:

networks:
  app-network:
    driver: bridge
