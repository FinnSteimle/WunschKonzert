services:
  api:
    environment:
      SPOTIFY_TOKEN_URL: http://spotify-mock:9090/api/token
      SPOTIFY_SEARCH_URL: http://spotify-mock:9090/v1/search
    depends_on:
      spotify-mock:
        condition: service_started
  frontend:
    build:
      args:
        PUBLIC_API_URL: http://api:8000
        PUBLIC_WS_URL: ws://api:8000
    environment:
      PUBLIC_API_URL: http://api:8000
      PUBLIC_WS_URL: ws://api:8000
  spotify-mock:
    image: python:3.14-slim
    working_dir: /mock
    command: python spotify_mock_server.py
    volumes:
      - ./backend/mock:/mock:ro
